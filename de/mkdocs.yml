site_name: lernOS Convention 2026
site_description: Infoseiten zur lernOS Convention 2026 mit allen Informationen zur Veranstaltung am 23.-24. Juni 2026.
site_url: https://loscon.lernos.org/de
docs_dir: src
site_dir: ../docs/de
edit_uri: ""

repo_name: 'cogneon/loscon26'
repo_url: 'https://github.com/cogneon/loscon26'


nav:
- Startseite: index.md
- Kommunikation: communication.md
- FAQ: faq.md
- Vorbereitung:
  - Vorab-Webkonferenz: pre-call.md
  - AI Crowdsourcing: ai-crowdsourcing.md
  - Merch: merch.md
  - Mitbringen: to-bring.md
  - Anreise: getting-there.md
  - Nachhaltigkeit: sustainability.md
  - Vorabend (22.06.): eve.md
- Programm:
  - Programm: program.md
  - Makeathon: makeathon.md
  - Abendprogramm: party.md
  - Coworking: coworking.md
  - Selbstorganisierte Sessions: sos.md
  - Dokumentation: documentation.md
  - Archiv: archive.md
- Veranstaltungsort:
  - Burg Nürnberg: location.md
  - Satelliten: loscon-everywhere.md
  - Barrierefreiheit: accessibility.md
  - Podcast-Tisch: podcasting.md
- Hybride Veranstaltung:
  - Perfectly Hybrid: perfectly-hybrid.md
  - Hybrid Meeting Kit: hmk.md
  - Rolle Room Buddy: role-room-buddy.md
  - Rolle Session Owner: role-session-owner.md
  - Rolle Satellite Owner: role-satellite-owner.md
  - Teams: teams.md
  - Discord: discord.md
  - Netzwerk: network.md
- Organisation:
  - Orga-Team: orga-team.md
  - Design: design.md
  - Infoseiten bearbeiten: infopages.md
  - Auf-/Abbau: logistics.md
  - Badge: badge.md
  - Stückliste: bom.md
  - Email: email.md

theme:
    name: readthedocs
    custom_dir: src/overrides
    locale: de
    logo: img/loscon26-badge.png

copyright: Creative Commons Namensnennung 4.0 International (CC BY)

extra_css:
  - loscon.css

extra_javascript:
  - javascripts/matomo.js

extra:
    giscus: true
    generator: false

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search